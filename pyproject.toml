[build-system]
requires = ["setuptools>=64", "setuptools_scm>8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[project]
name = "fftvis"
description = "An FFT-based visibility simulator"
readme = "README.md"
authors = [
    {name="Tyler Cox", email='tyler.a.cox@berkeley.edu'},
    {name="Steven Murray", email="steven.murray@sns.it"}
]
license = {text="MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy",
    "matvis>=1.3.2",
    "finufft",
    "pyuvdata>=3.1.2",
    "psutil",
    "typer",
    "rich",
    "ray",
    "threadpoolctl",
    "numba",
    "memray"
]
dynamic = ["version"]


[project.optional-dependencies]
# NOTE: cupy is deliberately NOT listed here. The `cupy` package on PyPI is a
# source distribution, so `pip install cupy` compiles the whole library from
# scratch (slow, and frequently OOM-killed). The prebuilt wheels are published
# under CUDA-specific names, so install the one matching your toolkit:
#
#     pip install cupy-cuda12x     # CUDA 12.x
#     pip install cupy-cuda11x     # CUDA 11.x
#
# The gpu-cuda12 / gpu-cuda11 extras below do this for you.
gpu = [
    # GPU type-3 transforms require finufft >= 2.4
    "cufinufft>=2.4",
]
gpu-cuda12 = [
    "cufinufft>=2.4",
    "cupy-cuda12x",
]
gpu-cuda11 = [
    "cufinufft>=2.4",
    "cupy-cuda11x",
]
dev = [
    "mpi4py",
    "pytest",
    "pre-commit",
    "pytest-cov",
    "pytest-xdist",
    "pyradiosky",
    "pyuvsim[sim]",
    "hera_sim"
]

[project.scripts]
fftvis = "fftvis.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}